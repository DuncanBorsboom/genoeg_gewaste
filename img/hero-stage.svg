<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" aria-hidden="true">
  <!-- Podium scene: stage, light beams, crowd, green growth -->
  <defs>
    <linearGradient id="beam1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8de9a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8de9a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7f5d6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#c7f5d6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23392b"/>
      <stop offset="1" stop-color="#16241a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fd08c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6fd08c" stop-opacity="0"/>
    </radialGradient>
    <style>
      .beam-g { transform-origin: 200px 92px; animation: sway 7s ease-in-out infinite; }
      .beam-g:nth-of-type(2) { animation-duration: 8.5s; animation-delay: -2s; }
      .beam-g:nth-of-type(3) { animation-duration: 9.5s; animation-delay: -4.5s; }
      @keyframes sway { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
      .sprout { transform-origin: bottom center; animation: sproutPulse 4s ease-in-out infinite; }
      @keyframes sproutPulse { 0%,100% { transform: scaleY(1) } 50% { transform: scaleY(1.12) } }
      .crowd-bob { animation: bob 2.6s ease-in-out infinite; transform-origin: center bottom; }
      @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
      @media (prefers-reduced-motion: reduce) { .beam-g, .sprout, .crowd-bob { animation: none !important; } }
    </style>
  </defs>

  <!-- background glow -->
  <circle cx="320" cy="180" r="220" fill="url(#glow)"/>

  <!-- truss with spotlights -->
  <rect x="120" y="60" width="400" height="10" rx="5" fill="#2c4234"/>
  <g>
    <!-- spotlights -->
    <g class="beam-g" transform="translate(200,70)">
      <rect x="-14" y="0" width="28" height="22" rx="6" fill="#3a5a46"/>
      <polygon points="-10,22 10,22 90,250 -90,250" fill="url(#beam1)"/>
    </g>
    <g class="beam-g" transform="translate(320,70)">
      <rect x="-14" y="0" width="28" height="22" rx="6" fill="#3a5a46"/>
      <polygon points="-10,22 10,22 70,250 -70,250" fill="url(#beam2)"/>
    </g>
    <g class="beam-g" transform="translate(440,70)">
      <rect x="-14" y="0" width="28" height="22" rx="6" fill="#3a5a46"/>
      <polygon points="-10,22 10,22 90,250 -90,250" fill="url(#beam1)"/>
    </g>
  </g>

  <!-- stage platform -->
  <rect x="90" y="300" width="460" height="60" rx="8" fill="url(#stage)"/>
  <rect x="90" y="300" width="460" height="8" rx="4" fill="#6fd08c" opacity="0.6"/>
  <!-- stage edge stripes -->
  <g stroke="#2e7d4f" stroke-width="3" opacity="0.5">
    <line x1="90" y1="322" x2="550" y2="322"/>
    <line x1="90" y1="340" x2="550" y2="340"/>
  </g>

  <!-- amps / speakers on stage -->
  <g fill="#1b2c21">
    <rect x="130" y="248" width="46" height="52" rx="6"/>
    <rect x="464" y="248" width="46" height="52" rx="6"/>
  </g>
  <g fill="#3a5a46">
    <circle cx="153" cy="272" r="12"/>
    <circle cx="487" cy="272" r="12"/>
    <circle cx="153" cy="290" r="6"/>
    <circle cx="487" cy="290" r="6"/>
  </g>

  <!-- mic stand center stage -->
  <g transform="translate(320,300)">
    <line x1="0" y1="0" x2="0" y2="-42" stroke="#8aa392" stroke-width="3"/>
    <circle cx="0" cy="-50" r="9" fill="#6fd08c"/>
    <ellipse cx="0" cy="2" rx="26" ry="5" fill="#101a13"/>
  </g>

  <!-- crowd silhouettes -->
  <g fill="#101a13">
    <circle cx="170" cy="392" r="16"/><rect x="154" y="402" width="32" height="48" rx="14"/>
    <circle cx="230" cy="388" r="18"/><rect x="212" y="400" width="36" height="52" rx="15"/>
    <circle cx="295" cy="396" r="15"/><rect x="280" y="406" width="30" height="46" rx="13"/>
    <circle cx="352" cy="386" r="19"/><rect x="333" y="398" width="38" height="54" rx="16"/>
    <circle cx="415" cy="394" r="16"/><rect x="399" y="404" width="32" height="48" rx="14"/>
    <circle cx="470" cy="390" r="17"/><rect x="453" y="402" width="34" height="50" rx="15"/>
  </g>
  <!-- raised hands -->
  <g stroke="#101a13" stroke-width="6" stroke-linecap="round" class="crowd-bob">
    <line x1="230" y1="398" x2="218" y2="372"/>
    <line x1="352" y1="396" x2="366" y2="366"/>
    <line x1="470" y1="402" x2="478" y2="374"/>
  </g>

  <!-- green sprout growing from stage -->
  <g class="sprout" transform="translate(560,360)">
    <path d="M0 0 C 0 -14 -2 -26 0 -40" stroke="#8de9a8" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 -18 C -12 -22 -18 -32 -18 -42 C -6 -40 0 -32 0 -18" fill="#6fd08c"/>
    <path d="M0 -26 C 12 -30 18 -40 18 -50 C 6 -48 0 -40 0 -26" fill="#2e7d4f"/>
  </g>
  <g class="sprout" transform="translate(80,360) scale(-1,1)" style="animation-delay:-2s">
    <path d="M0 0 C 0 -12 -2 -22 0 -34" stroke="#8de9a8" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M0 -16 C -10 -20 -15 -28 -15 -36 C -5 -34 0 -27 0 -16" fill="#6fd08c"/>
    <path d="M0 -22 C 10 -26 15 -34 15 -42 C 5 -40 0 -33 0 -22" fill="#2e7d4f"/>
  </g>
</svg>
