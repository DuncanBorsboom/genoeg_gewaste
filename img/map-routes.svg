<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none" aria-hidden="true">
  <!-- Reisebewegingen: kaart met podia en routes -->
  <defs>
    <marker id="dotG" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6">
      <circle cx="4" cy="4" r="3.5" fill="#2e7d4f"/>
    </marker>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fd08c"/>
      <stop offset="1" stop-color="#2e7d4f"/>
    </linearGradient>
  </defs>
  <!-- abstract landmass -->
  <path d="M30 30 C 60 12 120 8 170 18 C 210 26 228 52 222 84 C 216 116 180 140 130 142 C 80 144 30 128 18 96 C 8 68 10 42 30 30 Z" fill="#e9f3ea" stroke="#c9e2cd" stroke-width="2"/>
  <style>
    .route { stroke-dasharray: 1 10; animation: flow 2.4s linear infinite; }
    .route.r2 { animation-duration: 3s; animation-delay: -1.2s; }
    .route.r3 { animation-duration: 3.6s; animation-delay: -0.6s; }
    @keyframes flow { to { stroke-dashoffset: -11; } }
    .venue { animation: venuePulse 2.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .venue.v2 { animation-delay: -0.7s; }
    .venue.v3 { animation-delay: -1.4s; }
    @keyframes venuePulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.28) } }
    @media (prefers-reduced-motion: reduce) { .route, .venue { animation: none !important; } }
  </style>
  <!-- routes -->
  <path class="route" d="M60 105 C 90 80 120 70 150 78" stroke="url(#route)" stroke-width="4" stroke-linecap="round"/>
  <path class="route r2" d="M60 105 C 75 55 110 35 150 40" stroke="url(#route)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path class="route r3" d="M150 78 C 185 65 205 60 215 50" stroke="url(#route)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- venues: main venue gets a clear centered stage mark -->
  <g class="venue-wrap">
    <circle class="venue" cx="60" cy="105" r="9" fill="#2e7d4f"/>
    <circle cx="150" cy="78" r="7" class="venue v2" fill="#2e7d4f"/>
    <circle cx="150" cy="40" r="6" class="venue v3" fill="#2e7d4f"/>
    <circle cx="215" cy="50" r="6" class="venue" fill="#6fd08c"/>
    <!-- stage mark centered in main venue: arch + baseline -->
    <path d="M55.2 109.5v-3.7a4.8 4.8 0 0 1 9.6 0v3.7z" fill="#fff"/>
    <line x1="53" y1="109.5" x2="67" y2="109.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
